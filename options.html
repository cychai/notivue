<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notivue 设置</title>
    <link rel="stylesheet" href="src/options.css">
  </head>
  <body>
    <header>
      <img class="brand-mark" src="assets/icons/icon48.png" alt="">
      <div>
        <strong>Notivue</strong>
        <span>本地优先的视频学习助手</span>
      </div>
    </header>
    <main>
      <div class="title-block">
        <span>SETTINGS</span>
        <h1>连接你的 AI</h1>
        <p>密钥仅保存在 Chrome 本地存储中，请求从扩展直接发往你选择的模型服务。</p>
      </div>

      <form id="settingsForm">
        <section>
          <div class="section-index">01</div>
          <div class="section-content">
            <h2>模型服务</h2>
            <label>
              <span>API Base URL</span>
              <input id="apiBaseUrl" type="url" required placeholder="https://api.deepseek.com">
            </label>
            <label>
              <span>Model</span>
              <input id="model" type="text" required placeholder="deepseek-chat">
            </label>
            <label>
              <span>API Key</span>
              <div class="password-field">
                <input id="apiKey" type="password" autocomplete="off" placeholder="仅保存在本机">
                <button id="toggleKeyBtn" type="button" aria-label="显示或隐藏密钥">显示</button>
              </div>
            </label>
            <div class="presets">
              <button type="button" data-provider="deepseek">DeepSeek</button>
              <button type="button" data-provider="openai">OpenAI</button>
              <button type="button" data-provider="doubao">豆包</button>
              <button type="button" data-provider="glm">GLM</button>
              <button type="button" data-provider="kimi">Kimi</button>
              <button type="button" data-provider="minimax">MiniMax</button>
              <button type="button" data-provider="custom">自定义</button>
            </div>
          </div>
        </section>

        <section>
          <div class="section-index">02</div>
          <div class="section-content">
            <h2>学习语言</h2>
            <label>
              <span>翻译目标</span>
              <select id="targetLanguage">
                <option value="简体中文">简体中文</option>
                <option value="繁体中文">繁体中文</option>
                <option value="English">English</option>
                <option value="日本語">日本語</option>
              </select>
            </label>
          </div>
        </section>

        <div class="form-actions">
          <span id="status" role="status"></span>
          <button type="submit">保存设置</button>
        </div>
      </form>

      <aside>
        <strong>隐私边界</strong>
        <p>无账号、无服务器、无遥测。字幕、分析缓存和笔记保存在本地；只有主动使用 AI 功能时，相关文本才会发送给所选模型服务。</p>
      </aside>
    </main>
    <script type="module" src="src/options.js"></script>
  </body>
</html>
